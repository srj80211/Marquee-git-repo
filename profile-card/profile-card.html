<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <script src="https://kit.fontawesome.com/0e94f6e160.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
        }
        .mainContainer{
            width: 350px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .profileImage{
            width: 100%;
            height: 150px;  
            background-color: #0096fa;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: 20px;
        }
        .profileImage .image{
            width: 30%;
            height: 70%;
            background: url("magical-anime-queen-stockcake.webp") no-repeat center;
            background-size: cover;
            border-radius: 50%;
            position: relative;
            top: 20px;
            border: 5px solid #0096fa;
        }
        .profileInfo{
            padding: 20px;
            text-align: center;
        }
        .profileInfo h2{
            font-size: 24px;
            color: #333;
        }   
        .profileInfo p{
            font-size: 14px;
            color: #777;
        }
        .socials{
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        .socials a{
            color: #777;
            font-size: 18px;
            margin: 0 10px;
            transition: color 0.3s;   
            padding: 10px;
            border-radius: 50%;
        }
        .socials a:hover{
            color: #333;
        }
        .contactInfo{
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        .contactInfo .subscribe, .contactInfo .message{
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .contactInfo .subscribe{
            background: #007bff;
            color: #fff;
            margin-right: 10px;
        }
        .contactInfo .subscribe:hover{
            background: #0056b3;
        }
        .contactInfo .message{
            background: #007bff;
            color: #fff;
        }
        .contactInfo .message:hover{
            background: #0056b3;
        }
        .statis{
            display: flex;
            justify-content: space-around;
            padding: 20px 0;
        }
        .statis .stat{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .statis .stat i{
            font-size: 20px;
            color: #777;
            margin-bottom: 5px;
        }
        .statis .stat p{
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="mainContainer">
        <div class="profileImage">
            <div class="image"></div>
        </div>
        <div class="profileInfo">
            <h2>CodingLab</h2>
            <p>YouTuber & Blogger</p>
        </div>
        <div class="socials">
            <a href="#" style="background: #3b5998; color: #fff;"><i class="fab fa-facebook-f"></i></a>
            <a href="#" style="background: #1da1f2; color: #fff;"><i class="fab fa-brands fa-twitter"></i></a>
            <a href="#" style="background: #e1306c; color: #fff;"><i class="fab fa fa-instagram"></i></a>
            <a href="#" style="background: #ff0000; color: #fff;"><i class="fab fa-brands fa-youtube"></i></a>
        </div>
        <div class="contactInfo">
            <div class="subscribe">Subscribe</div>
            <div class="message">Message</div>
        </div>
        <div class="statis">
            <div class="stat">
                <i class="fa-regular fa-heart"></i>
                <p>60.4K</p>
            </div>
            <div class="stat">
                <i class="fa-regular fa-comment"></i>
                <p>20K</p>
            </div>
            <div class="stat">
                <i class="fa-solid fa-share fa-flip-horizontal"></i>
                <p>12.4k</p>
            </div>
        </div>
    </div>
</body>
</html>
