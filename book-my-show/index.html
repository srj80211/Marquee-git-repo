<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Clone Layout</title>
    <link rel="stylesheet" href="BookMyShow.css">

<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="" alt="BookMyShow Logo">
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities">
            </div>
            <div class="nav-right">
                <span class="location-picker">Ahmedabad</span>
                <button class="signin-btn">Sign in</button>
                <div class="hamburger-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </header>

    <nav class="sub-nav">
        <div class="sub-nav-container">
            <div class="nav-links-left">
                <a href="#">Movies</a>
                <a href="#">Stream</a>
                <a href="#">Events</a>
                <a href="#">Plays</a>
                <a href="#">Sports</a>
                <a href="#">Activities</a>
                <a href="#">TATA IPL 2026</a>
            </div>
            <div class="nav-links-right">
                <a href="#">ListYourShow</a>
                <a href="#">Corporates</a>
                <a href="#">Offers</a>
                <a href="#">Gift Cards</a>
            </div>
        </div>
    </nav>

            </div>
        </div>
        
    </section>
